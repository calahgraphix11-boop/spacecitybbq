site_url: https://sage-griffin-303b4f.netlify.app

backend:
  name: git-gateway
  branch: master
  identity_url: https://sage-griffin-303b4f.netlify.app/.netlify/identity
  gateway_url: https://sage-griffin-303b4f.netlify.app/.netlify/git

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Info"
        file: "_data/settings.json"
        fields:
          - { label: "Hours", name: "hours", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Status / Alert Message", name: "status_message", widget: "text", required: false, hint: "Shown in the Specials card on the homepage (e.g. a temporary closure). Leave blank to show the default link to Summer Specials instead." }
          - { label: "Summer Specials", name: "specials", widget: "list", required: false, hint: "Shown in the Summer Specials card on the homepage menu.", fields: [
              { label: "Name", name: "name", widget: "string" },
              { label: "Price", name: "price", widget: "string", hint: "e.g. $1 each, $14 / 1/2 lb" },
              { label: "Description", name: "description", widget: "string", required: false }
            ] }
          - { label: "Scratch Sides", name: "sides", widget: "list", required: false, hint: "Shown in the Scratch Sides list on the homepage menu.", fields: [
              { label: "Name", name: "name", widget: "string" },
              { label: "Price", name: "price", widget: "string", required: false, hint: "e.g. $5 medium, $10 large" },
              { label: "Description", name: "description", widget: "string", required: false }
            ] }
          - { label: "Ribs Photo", name: "photo_dish_ribs", widget: "image", required: false }
          - { label: "Brisket Category Photo", name: "photo_cat_brisket", widget: "image", required: false }
          - { label: "Sausage Category Photo", name: "photo_cat_sausage", widget: "image", required: false }
          - { label: "Plates Category Photo", name: "photo_cat_plates", widget: "image", required: false }
          - { label: "Pitmaster Portrait", name: "photo_founder_logan", widget: "image", required: false }
          - { label: "Most Ordered Brisket Feature Photo", name: "photo_feature_brisket", widget: "image", required: false }
          - { label: "Plates Combo Photo", name: "photo_dish_combo", widget: "image", required: false }
          - { label: "TX Trinity Box Photo", name: "photo_dish_trinity", widget: "image", required: false }
          - { label: "Loaded Brisket Nachos Photo", name: "photo_dish_nachos", widget: "image", required: false }
          - { label: "Burnt Ends Photo", name: "photo_dish_burnt_ends", widget: "image", required: false }
          - { label: "Prime Brisket Photo", name: "photo_dish_brisket", widget: "image", required: false }
